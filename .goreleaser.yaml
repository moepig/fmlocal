# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: fmlocal

builds:
  - id: fmlocal
    main: ./cmd/fmlocal
    binary: fmlocal
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: fmlocal
    formats: [ tar.gz ]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true

dockers_v2:
  - id: fmlocal
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/moepig/fmlocal
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/moepig/fmlocal"

release:
  prerelease: auto
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  mode: keep-existing
