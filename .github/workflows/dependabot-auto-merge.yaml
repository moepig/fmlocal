name: Dependabot Auto Merge

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Merge
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Validate and merge Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]]
          workflow_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID")
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .event == "pull_request" and
            .status == "completed" and
            .conclusion == "success" and
            .actor.login == "dependabot[bot]" and
            .repository.full_name == $repository and
            .head_repository.full_name == $repository and
            (.path | split("@")[0]) == ".github/workflows/test.yaml"
          ' <<< "$workflow_run" > /dev/null

          pr_number=$(jq -er '
            .pull_requests | select(length == 1) | .[0].number
            | select(type == "number" and . > 0 and . == floor)
          ' <<< "$workflow_run")
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          head_sha=$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' <<< "$workflow_run")

          pull_request=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg sha "$head_sha" --argjson number "$pr_number" '
            .number == $number and
            .state == "open" and
            .draft == false and
            .user.login == "dependabot[bot]" and
            .base.repo.full_name == $repository and
            .head.repo.full_name == $repository and
            .head.sha == $sha
          ' <<< "$pull_request" > /dev/null

          gh pr merge "$pr_number" --squash --match-head-commit "$head_sha" --repo "$GITHUB_REPOSITORY"
