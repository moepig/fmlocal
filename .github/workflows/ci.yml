name: CI
on:
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: read
jobs:
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run unit tests
        run: go test -short ./internal/...
  e2e-test:
    name: e2e-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run e2e tests
        run: go test ./test/e2e/...
  release-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: v2.20.2
          args: release --snapshot --clean
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      - release-snapshot
      - unit-test
      - e2e-test
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every CI job to succeed
        if: ${{ needs['release-snapshot'].result != 'success' || needs['unit-test'].result != 'success' || needs['e2e-test'].result != 'success' }}
        run: exit 1
concurrency:
  group: ${{ format('ci-{0}', github.ref) }}
  cancel-in-progress: true
